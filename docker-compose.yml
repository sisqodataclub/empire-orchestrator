services:
  # ============================================================
  # OLD SINGLE‑TENANT API (for existing clients)
  # ============================================================
  api-old:
    build:
      context: .
      target: api-old
    container_name: empire-api-old
    restart: always
    env_file:
      - .env
    ports:
      - "8003:8000"
    networks:
      - proxy_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================
  # NEW MULTI‑TENANT API (for new clients)
  # ============================================================
  api-new:
    build:
      context: .
      target: api-new
    container_name: empire-api-new
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/workspaces/tenants.db
      - WORKSPACE_ROOT=/app/data/workspaces
      - TELEGRAM_DB_PATH=/app/data/workspaces/telegram_bots.db
    ports:
      - "8001:8001"
    volumes:
      - ./data/workspaces:/app/data/workspaces
      - ./data/hf_cache:/root/.cache/huggingface
    networks:
      - proxy_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================
  # TELEGRAM BOT MANAGER (subprocess‑based, one worker per org)
  # ============================================================
  telegram-bot:
    build:
      context: .
      target: telegram-bot
    container_name: empire-telegram-bot
    restart: always
    env_file:
      - .env
    environment:
      - WORKSPACE_ROOT=/app/data/workspaces
      - TELEGRAM_DB_PATH=/app/data/workspaces/telegram_bots.db

      # ── Log watcher ────────────────────────────────────────────
      # Background thread that scans container logs and queues
      # [AUTO-ALERT] messages into the CEO's inbox when new error
      # lines appear. Disabled by default; set ENABLED to "true".
      # INTERVAL is in seconds (30 for testing, 300 for production).
      # CONTAINERS is a comma-separated list matching `docker ps`
      # names exactly; empty/unset means watch every container.
      - LOG_WATCHER_ENABLED=true
      - LOG_WATCHER_INTERVAL=25000
      - LOG_WATCHER_CONTAINERS=ddeep-forms,backend,empire-api-new,empire-telegram-bot,nginx-proxy-manager

    volumes:
      # Workspace tree: each org's workspace, secrets, chroma DB, etc.
      - ./data/workspaces:/app/data/workspaces
      # HuggingFace model cache (SentenceTransformer, CrossEncoder)
      - ./data/hf_cache:/root/.cache/huggingface

      # Read-only access to every container's json-file log on the host.
      # Required by tools/container_logs_tool.py and
      # orchestration/log_watcher.py. Without this, list_containers(),
      # read_container_logs(), scan_for_errors(), container_health(),
      # and the log watcher itself all return "no logs accessible".
      - /var/lib/docker/containers:/host_containers:ro

    networks:
      - proxy_network
    depends_on:
      api-new:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  proxy_network:
    external: true

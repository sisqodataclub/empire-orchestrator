services:
  # ============================================================
  # OLD SINGLE‑TENANT API (for existing clients)
  # ============================================================
  api-old:
    build:
      context: .
      target: api-old
    container_name: empire-api-old
    restart: always
    env_file:
      - .env
    ports:
      - "8003:8000"
    networks:
      - proxy_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================
  # NEW MULTI‑TENANT API (for new clients)
  # ============================================================
  api-new:
    build:
      context: .
      target: api-new
    container_name: empire-api-new
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/workspaces/tenants.db
      - WORKSPACE_ROOT=/app/data/workspaces
      - TELEGRAM_DB_PATH=/app/data/workspaces/telegram_bots.db
    ports:
      - "8001:8001"
    volumes:
      - ./data/workspaces:/app/data/workspaces
      - ./data/hf_cache:/root/.cache/huggingface
    networks:
      - proxy_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================
  # TELEGRAM BOT MANAGER (subprocess‑based, one worker per org)
  # ============================================================
  telegram-bot:
    build:
      context: .
      target: telegram-bot
    container_name: empire-telegram-bot
    restart: always
    env_file:
      - .env
    environment:
      - WORKSPACE_ROOT=/app/data/workspaces
      - TELEGRAM_DB_PATH=/app/data/workspaces/telegram_bots.db
    volumes:
      - ./data/workspaces:/app/data/workspaces
      - ./data/hf_cache:/root/.cache/huggingface
    networks:
      - proxy_network
    depends_on:
      api-new:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  proxy_network:
    external: true
